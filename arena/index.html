<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
 <meta name="theme-color" content="#ec673a">
 <meta name="robots" content="noindex">
 <meta name="description" content="Little Clauses. Rising water. Grab on and stay above it.">
 <title>Claus · Arena</title>
 <link rel="icon" href="/arena/brand/favicon-ec673a.png">
 <link rel="preload" href="/arena/brand/newsreader-latin.woff2" as="font" type="font/woff2" crossorigin>
 <link rel="stylesheet" href="/arena/styles.css">
 <script type="module" src="/arena/app.mjs"></script>
</head>
<body data-stage="entry">
 <header class="masthead">
 <a class="wordmark" href="https://claus.si/Home" aria-label="Claus home"><canvas id="mark" width="96" height="96" aria-hidden="true"></canvas></a>
 <a class="x-link" href="https://x.com/ClausAgent" target="_blank" rel="noopener noreferrer" aria-label="Claus on X"><svg viewBox="0 0 1200 1226.37" aria-hidden="true"><path d="M714.163 519.284L1160.89 0H1055.03L667.137 450.887L357.328 0H0L468.492 681.821L0 1226.37H105.866L515.491 750.218L842.672 1226.37H1200L714.137 519.284H714.163ZM569.165 687.828L521.697 619.934L144.011 79.6944H306.615L611.412 515.685L658.88 583.579L1055.08 1150.3H892.476L569.165 687.854V687.828Z"/></svg></a>
 </header>

 <main>
 <section class="arena" aria-label="Claus singleplayer arena">
 <canvas id="arena" tabindex="0" aria-label="Game arena. Move with A and D or arrow keys. Space to jump. Hold E or the mouse to reach with a tentacle."></canvas>
 <section id="entry" class="entry" aria-labelledby="entry-title">
 <h1 id="entry-title">Choose your name</h1>
 <form id="join-form" class="join-form" novalidate>
 <label id="username-label" class="visually-hidden" for="username">Username</label>
 <div class="join-row">
 <input id="username" name="username" required minlength="2" maxlength="20" pattern="[A-Za-z0-9_][A-Za-z0-9_.\-]{1,19}" autocomplete="nickname" autocapitalize="off" spellcheck="false" aria-describedby="error">
 <button id="play" class="primary" type="submit">Play</button>
 </div>
 <p id="error" class="error" role="alert" hidden></p>
 <button class="board-link" data-open-board type="button">Top 10</button>
 </form>
 </section>
 <section id="menu" class="result" hidden aria-labelledby="result-title">
 <h1 id="result-title">Score <strong id="result-score">0</strong></h1>
 <p class="result-time"><time id="result-time">0:00</time> survived</p>
 <div class="result-actions"><button id="retry" class="primary" type="button">Retry</button><button class="board-link" data-open-board type="button">Top 10</button></div>
 <p id="save-status" role="status" hidden>Saving score…</p>
 </section>
 <dialog id="leaderboard" class="leaderboard" aria-labelledby="leaderboard-title">
 <button id="close-board" class="icon-button" type="button" aria-label="Close leaderboard">×</button>
 <h2 id="leaderboard-title">Top 10</h2>
 <table id="leaderboard-table" hidden><thead><tr><th scope="col">#</th><th scope="col">Player</th><th scope="col">Score</th><th scope="col">Time</th></tr></thead><tbody id="leaderboard-rows"></tbody></table>
 <p id="leaderboard-empty">No scores yet.</p>
 <p class="score-rule">Your highest climb. Time breaks a tie.</p>
 </dialog>
 <div id="hud" class="hud" hidden>
 <div id="run-status" class="run-status" hidden><span id="climb-progress" aria-label="Highest score"></span><time id="round-time" aria-label="Time survived"></time></div>
 <span id="market-wave" class="market-wave" role="status" hidden><svg viewBox="0 0 28 20" aria-hidden="true"><path d="M1 6q4-6 8 0t9 0t9 0M1 14q4-6 8 0t9 0t9 0"/></svg><span>Pool wave</span></span>
 <button id="leave" class="icon-button" type="button" aria-label="Leave the arena">×</button>
 </div>
 <div id="reconnecting" class="reconnecting" role="status" hidden>Reconnecting…</div>
 <div id="touch-controls" class="touch-controls" hidden aria-label="Touch controls">
 <div class="move-pad"><button data-control="left" aria-label="Move left">←</button><button data-control="right" aria-label="Move right">→</button></div>
 <div class="action-pad"><button data-control="grab" class="grab-button" aria-label="Hold to grab"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M9 33V19c0-9 21-12 21-3 0 6-9 6-9 1"/></svg><span>grab</span></button><button data-control="jump" class="jump-button" aria-label="Jump">↑<span>jump</span></button></div>
 </div>
 </section>

 <footer id="game-footer" class="game-footer" hidden>
 <div class="controls-hint"><span><kbd>A</kbd><kbd>D</kbd> move</span><span><kbd>SPACE</kbd> jump</span><span>Hold <kbd>E</kbd> to grab</span></div>
 </footer>
 </main>
 <noscript><p class="no-script">Enable JavaScript to play Claus Arena. No wallet or account is needed.</p></noscript>
</body>
</html>
